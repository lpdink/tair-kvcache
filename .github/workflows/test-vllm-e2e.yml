name: test-vllm-e2e
permissions:
  contents: read
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      runs-on:
        description: "GPU runner label (needs >= 2 GPUs, e.g. A10)"
        type: string
        default: "gpu-a10-x2"
      test_target:
        description: "Bazel test target(s)"
        type: string
        default: "//integration_test/vllm_e2e:test_basic //integration_test/vllm_e2e:test_concurrent //integration_test/vllm_e2e:test_tp"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vllm-e2e:
    name: vllm-e2e
    # GPU runners are self-hosted; the default label can be overridden per-repo
    # via the VLLM_E2E_RUNS_ON variable or the workflow_dispatch input.
    runs-on: ${{ inputs.runs-on || vars.VLLM_E2E_RUNS_ON || 'gpu-a10-x2' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: check_gpus
        run: |
          nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
          GPU_COUNT=$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l)
          if [ "$GPU_COUNT" -lt 2 ]; then
            echo "::error::This test needs at least 2 GPUs, found $GPU_COUNT"
            exit 1
          fi

      - name: build_binaries
        run: |
          set -x
          bazelisk build //kv_cache_manager:kv_cache_manager_bin \
            //kv_cache_manager/client/pybind:kvcm_py_client_lib_wheel \
            //kv_cache_manager/py_connector/vllm:kvcm_vllm_connector_wheel \
            --stamp

      - name: setup_python_env
        # The e2e test drives a real venv with torch + vllm + the built KVCM
        # wheels. Reuse the machine's venv if present, otherwise create one.
        run: |
          set -x
          VENV_PY="${KVCM_E2E_PYTHON:-/root/ws/env/global_vllm/.venv/bin/python}"
          if [ ! -x "$VENV_PY" ]; then
            python3 -m venv /tmp/kvcm_e2e_venv
            VENV_PY=/tmp/kvcm_e2e_venv/bin/python
            "$VENV_PY" -m pip install --upgrade pip
            "$VENV_PY" -m pip install "vllm==0.22.1"
            echo "KVCM_E2E_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          fi
          # Install the freshly built KVCM wheels (names carry a version stamp).
          "$VENV_PY" -m pip install --no-deps --force-reinstall \
            bazel-bin/kv_cache_manager/client/pybind/kvcm_py_client-*.whl \
            bazel-bin/kv_cache_manager/py_connector/vllm/kvcm_vllm_connector-*.whl || \
          "$VENV_PY" -m pip install --no-deps --force-reinstall \
            "$(ls bazel-bin/kv_cache_manager/client/pybind/kvcm_py_client-*.whl | head -1)" \
            "$(ls bazel-bin/kv_cache_manager/py_connector/vllm/kvcm_vllm_connector-*.whl | head -1)"
          "$VENV_PY" -m pip install orjson cattrs requests

      - name: download_model
        # The model is expected at KVCM_E2E_MODEL (default
        # /root/ws/resources/models/Qwen2.5-7B-Instruct). On self-hosted GPU
        # runners it is usually pre-cached; otherwise fetch it here.
        run: |
          MODEL="${KVCM_E2E_MODEL:-/root/ws/resources/models/Qwen2.5-7B-Instruct}"
          if [ ! -f "$MODEL/config.json" ]; then
            echo "::error::Model not found at $MODEL; provision it on the runner or set KVCM_E2E_MODEL"
            exit 1
          fi

      - name: run_e2e_tests
        env:
          # workflow_dispatch inputs are routed through env (never interpolated
          # inline into the shell) and fall back to a fixed, validated default.
          # The tests are tagged manual, so they must be named explicitly --
          # wildcard patterns would exclude them.
          E2E_TEST_TARGET: ${{ inputs.test_target || '//integration_test/vllm_e2e:test_basic //integration_test/vllm_e2e:test_concurrent //integration_test/vllm_e2e:test_tp' }}
        run: |
          set -x
          for t in $E2E_TEST_TARGET; do
            case "$t" in
              //integration_test/vllm_e2e:test_*) ;;
              *) echo "::error::unexpected test target: $t"; exit 1 ;;
            esac
          done
          # Word-splitting is safe: every token was validated above.
          bazelisk test $E2E_TEST_TARGET \
            --cache_test_results=no --test_output=errors \
            --test_env=KVCM_E2E_PYTHON="${KVCM_E2E_PYTHON:-/root/ws/env/global_vllm/.venv/bin/python}" \
            --test_env=KVCM_E2E_MODEL="${KVCM_E2E_MODEL:-/root/ws/resources/models/Qwen2.5-7B-Instruct}"

      - name: upload_logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vllm-e2e-logs
          path: |
            /tmp/kvcm_vllm_e2e/**/*.stdout
            /tmp/kvcm_vllm_e2e/**/*.stderr
            bazel-out/*-opt/testlogs/integration_test/vllm_e2e/**
          if-no-files-found: ignore
